name: RPGJS baseline

on:
  pull_request:
    paths:
      - 'rpgjs/**'
      - 'shared/**'
      - '.github/workflows/rpgjs.yml'
  push:
    branches: [main]
    paths:
      - 'rpgjs/**'
      - 'shared/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpgjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rpgjs/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static game
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/data/scenario.json
          test -f dist/map/office-lobby.tmx
