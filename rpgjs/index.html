<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2028" />
    <title>Badge Incident — Security RPG</title>
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css" />
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css" />
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default/theme.css" />
    <link rel="stylesheet" href="./visual-shell.css" />
    <style>
      html, body, #rpg { margin:0; padding:0; width:100%; height:100%; min-height:100dvh; overflow:hidden; background:transparent; overscroll-behavior:none; }
      body { position:fixed; inset:0; touch-action:none; }
      #rpg { filter:saturate(1.08) contrast(1.03); }
    </style>
  </head>
  <body>
    <div id="rpg"></div>
    <div id="game-shell" aria-hidden="true">
      <section class="mission-card">
        <div class="mission-kicker">Security awareness · Scenario 01</div>
        <div class="mission-title">Badge Incident</div>
        <div class="mission-text">Get to your desk. A visitor near the secure entrance may need your attention.</div>
      </section>
      <div class="zone-chip">ACCESS CONTROLLED</div>
      <div class="secure-glow"></div>
      <div class="legend"><strong>Move</strong> with arrows / joystick · <strong>Interact</strong> with Space / A</div>
    </div>
  </body>
</html>
